version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./database.db:/app/database.db
    environment:
      - PYTHONUNBUFFERED=1

  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./app:/app
    command: python -m http.server 3000
    ports:
      - "3000:3000"

  bot:
    build: .
    command: python main.py
    depends_on:
      - api
    env_file:
      - .env
